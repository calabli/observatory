[package]
name = "observatory"
version = "0.1.7"
edition = "2021"
license = "MIT"
description = "Local AI usage observatory"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
observatory-usage-core = { path = "../native" }

[features]
custom-protocol = ["tauri/custom-protocol"]
