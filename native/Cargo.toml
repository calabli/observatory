[package]
name = "observatory-usage-core"
version = "0.1.19"
edition = "2021"
license = "MIT"

[lib]
name = "observatory_usage_core"
test = false
doctest = false

[[bin]]
name = "observatory-engine"
path = "src/main.rs"
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
rust_decimal = "1.33"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = "0.7"
futures = "0.3"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
zstd = "0.13"
regex = "1"
json5 = "0.4"
toml = "0.8"
tempfile = "3"
log = "0.4"
url = "2"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
