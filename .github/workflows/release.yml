name: Build release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - os: macos-15
            args: --target aarch64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Verify pairing and multi-device scans
        run: cargo test --manifest-path native/Cargo.toml --test pairing_codes --test scan_jobs --test lan_pair_scan --test lan_storage --test usage_http_api --locked
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: '观测台 v__VERSION__'
          releaseBody: '用量 HTTP 接口新增日期区间、秒级时间区间、模型筛选，以及按天/周/月聚合。返回总 Token、估算费用、请求数和分组数据，保留 v0.1.30 字段兼容。新增 Postman 集合与请求验证，历史日汇总无法精确拆分时明确返回 422。接口仅查询本机允许共享的数据，使用方式见 docs/只读用量HTTP接口.md。局域网使用明文通信。macOS 构建未公证。'
          releaseDraft: true
          prerelease: false
          assetNamePattern: 'Observatory-[version]-[platform]-[arch][setup][ext]'
          args: ${{ matrix.args }}
      - name: Verify macOS network snapshot
        if: runner.os == 'macOS'
        run: cargo test --manifest-path native/Cargo.toml --test usage_integration network_snapshot_exposes_valid_local_interface_data
      - name: Verify macOS tray usage totals
        if: runner.os == 'macOS'
        run: cargo test --manifest-path native/Cargo.toml --test usage_integration tray_summary_counts_only_local_today
      - name: Verify macOS peer and aggregate projections
        if: runner.os == 'macOS'
        run: cargo test --manifest-path native/Cargo.toml --test usage_integration peer_snapshots_support_filters_replace_and_disabled_devices
      - name: Verify macOS code signature and disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          codesign --display --verbose=4 "$app"
          dmg=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"
      - name: Upload portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $portable = "Observatory-$version-Windows-x64-portable.exe"
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/observatory.exe $portable
          gh release upload "v$version" $portable --clobber
  manifest:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish update manifest and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $win = $release.assets | Where-Object { $_.name -like '*x64-setup.exe' } | Select-Object -First 1
          $mac = $release.assets | Where-Object { $_.name -like '*.app.tar.gz' } | Select-Object -First 1
          if (!$win -or !$mac) { throw 'Missing update packages' }
          gh release download $tag --pattern '*.sig' --dir signatures
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download signatures' }
          $manifest = @{ version=$version; notes="观测台 $tag"; platforms=@{
            'windows-x86_64'=@{ signature=(Get-Content -Raw (Join-Path signatures ($win.name + '.sig'))).Trim(); url="https://github.com/${{ github.repository }}/releases/download/$tag/$($win.name)" }
            'darwin-aarch64'=@{ signature=(Get-Content -Raw (Join-Path signatures ($mac.name + '.sig'))).Trim(); url="https://github.com/${{ github.repository }}/releases/download/$tag/$($mac.name)" }
          }}
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM latest.json
          gh release upload $tag latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload update manifest' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release' }
